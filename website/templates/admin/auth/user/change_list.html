{% extends "admin/change_list.html" %}
{% load admin_urls i18n %}

{% block object-tools-items %}
    {% if has_add_permission %}
        {% url cl.opts|admin_urlname:"add" as add_url %}
        <div class="flex flex-row items-center">
            <a href="{% add_preserved_filters add_url is_popup to_field %}" class="bg-primary-600 flex flex-row font-medium gap-2 items-center h-[38px] justify-center px-3 py-2 rounded-default text-white hover:bg-primary-600/80" title="{% translate 'Add user' %}">
                <span class="material-symbols-outlined text-white">add</span>
                {% translate "Add user" %}
            </a>
        </div>
    {% endif %}
{% endblock %}
