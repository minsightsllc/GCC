{% if active_section == 'tasks' and request.GET.edit == 'task' and can_edit_selected_task %}
<section class='record-detail workspace-form time-edit-panel'>
    <div class='admin-section-heading compact'><div><span class='section-kicker'>Task editor</span><h3>Update {{ selected_task.title }}</h3></div></div>
    <form class='task-association-form' data-task-association-form method='post' action='{% if team_mode %}/team/tasks/{{ selected_task.pk }}/update/{% else %}/dashboard/tasks/{{ selected_task.pk }}/update/{% endif %}'>{% csrf_token %}<div class='workspace-form-grid'>{% for field in task_form %}<label class='form-field{% if field.name == 'project' %} task-project-field{% endif %}'{% if field.name == 'project' %} data-task-project-field{% endif %}>{{ field.label }}{{ field }}{% if field.help_text %}<small class='field-help'>{{ field.help_text }}</small>{% endif %}{{ field.errors }}</label>{% endfor %}</div><button class='button button-primary' type='submit'>Save task</button></form>
</section>
{% endif %}
